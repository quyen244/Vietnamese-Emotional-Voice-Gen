version: '3.8'

services:
  tts_backend:
    build: .
    container_name: vn_emovoice_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    # Enable volume mapping if you want models mapped to host system to avoid redownloading
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          # Uncomment below blocks to enable GPU access for PyTorch inside Docker
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: vn_emovoice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - tts_backend
